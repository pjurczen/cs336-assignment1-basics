# Builds the training image and pushes it to Artifact Registry. Submitted by scripts/build_image.sh.
# Every build starts on an empty machine, so pull the previous image and reuse its layers: when only code changes,
# the ~4 GB dependency layer is neither reinstalled nor pushed again.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [ "-c", "docker pull ${_IMAGE} || exit 0" ]
  - name: gcr.io/cloud-builders/docker
    args: [ "build", "-t", "${_IMAGE}", "--cache-from", "${_IMAGE}", "--build-arg", "BUILDKIT_INLINE_CACHE=1", "." ]
images:
  - "${_IMAGE}"
options:
  # Required when the build runs as a user-specified service account.
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
